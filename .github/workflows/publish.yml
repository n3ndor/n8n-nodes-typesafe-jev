# Publishes this n8n community node package to npm on every version tag push.
#
# Since May 1 2026, n8n requires all community nodes to be published via GitHub
# Actions with npm provenance statements. Provenance lets anyone cryptographically
# verify that a package was built by this exact workflow, from this exact
# repository and commit. Local `npm publish` will not satisfy verification.
#
# IMPORTANT: npm can only configure a Trusted Publisher on a package that
# ALREADY EXISTS in the registry. There is no "pending" trusted publisher, so a
# brand new package cannot use OIDC for its first publish. The first release has
# to be authenticated with a token; OIDC takes over from the second one.
#
# STEP 1, first publish only, granular access token:
#   1. npmjs.com -> Access Tokens -> Generate New Token -> Granular Access Token.
#      Packages and scopes: "Only select packages and scopes" is not available
#      for a name that does not exist yet, so scope it to your user account with
#      "Read and write". Set a short expiry (1 to 7 days); it is thrown away in
#      step 3.
#   2. GitHub -> repo Settings -> Secrets and variables -> Actions -> New
#      repository secret, named NPM_TOKEN.
#   3. Push a version tag. This workflow publishes with provenance, because
#      provenance comes from `id-token: write` below and works either way.
#
# STEP 2, immediately after that first publish, switch to OIDC:
#   1. npmjs.com -> Packages -> n8n-nodes-typesafe-jev -> Settings.
#   2. "Trusted publishing" -> "Add a publisher". Select GitHub Actions:
#        Repository owner: n3ndor
#        Repository name:  n8n-nodes-typesafe-jev
#        Workflow name:    publish.yml
#        Environment:      (leave blank)
#   3. DELETE the NPM_TOKEN secret from the GitHub repo, and revoke the token on
#      npmjs.com. The step below skips the token path when NPM_TOKEN is unset
#      and npm falls back to the OIDC exchange.
#
# RELEASE: run `pnpm run release` locally. It lints, builds, prompts for a
# version bump, updates the changelog, commits, tags and pushes, which triggers
# this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          pnpm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
