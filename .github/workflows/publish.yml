# Publishes this n8n community node package to npm on every version tag push.
#
# Since May 1 2026, n8n requires all community nodes to be published via GitHub
# Actions with npm provenance statements. Provenance lets anyone cryptographically
# verify that a package was built by this exact workflow, from this exact
# repository and commit. Local `npm publish` will not satisfy verification.
#
# AUTH: this workflow holds no npm token. It authenticates by exchanging the
# GitHub OIDC token minted by `id-token: write` below, against a Trusted
# Publisher registered on npm. Nothing long lived is stored in this repository.
#
# BOOTSTRAP: a Trusted Publisher can only be attached to a package that already
# exists. That holds for the npmjs.com website and for `npm trust` alike; the
# CLI answers 404 on a name that has never been published, and its --dry-run
# does not catch this, because the dry run validates arguments without calling
# the endpoint. So the first version is published locally, by the account owner
# under 2FA, and every version after it comes from here with provenance:
#
#   1. npm publish            (local, once, creates the name)
#   2. npm trust github "@n3ndor/n8n-nodes-typesafe-jev" \
#        --file publish.yml \
#        --repo n3ndor/n8n-nodes-typesafe-jev \
#        --allow-publish
#   3. npm trust list "@n3ndor/n8n-nodes-typesafe-jev"   (confirm)
#
# No npm token is created at any point, and none is stored in this repository.
# Withdraw the grant with `npm trust revoke`. Note what it grants: anyone who
# can push a tag to this repository can publish the package, so repository
# write access is publish access.
#
# Only the bootstrap version lacks provenance. Submit a later one to the n8n
# Creator Portal.
#
# RELEASE: run `pnpm run release` locally. It prompts for a version bump,
# updates the changelog, commits, tags and pushes, which triggers this
# workflow. The same command behaves differently here, because `n8n-node
# release` detects GITHUB_ACTIONS and builds and publishes with provenance
# instead of bumping.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      # The OIDC exchange with npm needs a recent npm. The one bundled with the
      # Node LTS image is not guaranteed to be new enough, and an old npm fails
      # by asking for a token rather than by naming the real cause.
      - name: Use an npm that speaks OIDC
        run: npm install --global npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm run release
